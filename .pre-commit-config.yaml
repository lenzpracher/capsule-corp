exclude: ^(\.copier-answers\.yml)|.pixi$
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml

  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: v0.3.0
    hooks:
      - id: ruff
        args: [--fix, --select=C901, select=E501]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        # The hook runs in its own isolated env, so it needs the runtime
        # dependencies whose decorators and models appear in our signatures.
        additional_dependencies:
          - types-setuptools
          - pydantic
          - typer
          - pytest
          - tomlkit
          - platformdirs
          - rich

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        types_or: [yaml, json, markdown, toml]
