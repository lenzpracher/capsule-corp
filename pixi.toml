[project]
authors = ["Lenz Pracher <lenz.pracher@gmail.com>"]
channels = ["conda-forge"]
description = "A terminal catalogue of reproducible, pre-registered research capsules"
name = "capsule-corp"
platforms = ["osx-arm64", "linux-64"]
version = "0.1.0"

[dependencies]
python = ">=3.12,<3.14"
typer = ">=0.12"
textual = ">=0.80"
pydantic = ">=2.7,<3"
tomlkit = ">=0.13"
rich = ">=13"
platformdirs = ">=4"
mcp = ">=2.2,<3"

[host-dependencies]
pip = "*"

[feature.build.dependencies]
python-build = "*"
wheel = "*"
setuptools = ">=64"
setuptools-scm = "*"

[feature.build.tasks]
postinstall = "pip install --no-build-isolation --no-deps --disable-pip-version-check -e ."
build-wheel = "python -m build --no-isolation --wheel ."

[feature.test.dependencies]
pytest = ">=8"
pytest-cov = "*"
anyio = ">=4.15.1,<5"

[feature.test.tasks]
test = "pytest tests/ -v --cov=capsule_corp"
test-coverage = "pytest tests/ -v --cov=capsule_corp --cov-report=term-missing"
test-integration = { cmd = "pytest tests/test_integration.py -v -s -m integration -p no:cacheprovider", env = { CAPSULE_CORP_INTEGRATION = "1" } }

[feature.docs.dependencies]
mkdocs-material = ">=9.7"
# MkDocs 2.0 removes the plugin and theming systems outright with no migration path,
# which would break this site entirely. Pin until Material supports it.
mkdocs = ">=1.6,<2"

[feature.docs.tasks]
docs-serve = "mkdocs serve"
docs-build = "mkdocs build --strict"

[feature.lint.dependencies]
pre-commit = "*"
ruff = "*"
prettier = "*"
taplo = "*"
mypy = "*"
types-setuptools = "*"
pre-commit-hooks = "*"

[feature.lint.tasks]
pre-commit-install = "pre-commit install"
pre-commit-run = "pre-commit run -a"
format = "ruff format . && ruff check . --fix --config pyproject.toml"
typecheck = "mypy src tests"

[environments]
default = { features = ["test", "build", "lint", "docs"] }
lint = { features = ["lint"], no-default-feature = true }
test = { features = ["test"], no-default-feature = true }
build = { features = ["build"], no-default-feature = true }
docs = { features = ["docs"], no-default-feature = true }
